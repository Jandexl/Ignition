[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ignis-ml"
version = "0.1.0"
description = "Grouped combustion evidence modeling with explicit abstention"
requires-python = ">=3.10"
dependencies = ["scipy>=1.10,<2", "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2", "jsonschema>=4.18,<5"]

[project.scripts]
ignis-ml = "ignis_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
